    function parseSlidesText(text) {
      const slideRegex = /\*\*Slide\s+(\d+)\s*[—–\-]\s*(.+?)\*\*/g;
      const matches = [...text.matchAll(slideRegex)];
      if (matches.length === 0) return null;
      const parsed = [];
      for (let i = 0; i < matches.length; i++) {
        const m = matches[i];
        const title = m[2].trim();
        const start = m.index + m[0].length;
        const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
        const body = text.slice(start, end).trim();
        parsed.push({ title, body });
      }
      const total = parsed.length;
      const contentCount = total - 1;
      return parsed.map((s, idx) => {
        const isFirst = idx === 0;
        const isLast = idx === total - 1;
        const kind = isFirst ? "cover" : (isLast ? "cta" : "content");
        const allLines = s.body.split("\n").map(l => l.trim()).filter(Boolean);
        const bullets = [];
        const textLines = [];
        let bulletsTitle = "";
        for (const l of allLines) {
          if (/^[-*•]\s/.test(l)) bullets.push(l.replace(/^[-*•]\s*/, "").trim());
          else if (/^[A-Za-z][^.!?]{0,40}:$/.test(l) && bullets.length === 0 && textLines.length > 0) bulletsTitle = l.replace(/:$/, "");
          else textLines.push(l);
        }
        const bodyText = textLines.join(" ");
        const sentences = bodyText.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(Boolean);
        const titleIsGeneric = /^(cover|intro|introduction|title|cta|conclusion|final|final slide)$/i.test(s.title);
        const slide = { kind, page: `${String(idx+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}` };
        if (isFirst) {
          slide.layout = "cover";
          slide.label = "EDUCATIONAL SERIES 01";
          if (titleIsGeneric) {
            slide.headline = sentences[0] || s.title;
            slide.sub = sentences.slice(1).join(" ");
          } else {
            slide.headline = s.title;
            slide.sub = bodyText || "";
          }
          slide.footerLeft = "SYSTEM 01";
        } else if (isLast) {
          slide.layout = "cta";
          slide.number = `${pad2(contentCount)} / ${pad2(contentCount)} + NEXT`;
          const ctaGeneric = titleIsGeneric || /^cta$/i.test(s.title);
          if (ctaGeneric) {
            slide.headline = sentences[0] || s.title;
            slide.cta = sentences.slice(1).join(" ") || (bullets[0] || "");
          } else {
            slide.headline = s.title;
            if (sentences.length > 1) slide.cta = sentences.slice(1).join(" ");
            else if (bullets.length) slide.cta = bullets[0];
            else if (bodyText) slide.cta = bodyText;
          }
          if (bullets.length > 1) slide.bullets = bullets.slice(1);
          else if (bullets.length === 1 && slide.cta !== bullets[0]) slide.bullets = bullets;
          slide.footerLeft = "Save for later use";
        } else {
          slide.layout = "list";
          slide.number = `${pad2(idx)} / ${pad2(contentCount)}`;
          slide.headline = s.title;
          if (bulletsTitle) slide.bulletsTitle = bulletsTitle;
          const keySentence = sentences.filter(x => x.length <= 120).sort((a, b) => a.length - b.length)[0];
          if (bullets.length) {
            const yellow = keySentence || bullets[0] || "";
            if (yellow) slide.yellow = yellow;
            slide.bullets = bullets;
          } else if (sentences.length > 1) {
            const last = sentences[sentences.length - 1];
            const key = last.length <= 140 ? last : (keySentence || last);
            if (key) slide.yellow = key;
            slide.bullets = sentences.filter(x => x !== key).slice(0, 4);
          } else if (bodyText) {
            slide.yellow = bodyText;
          }
          slide.footerLeft = `PROFESSIONAL PUBLISHING - ${String(idx).padStart(2,"0")}`;
          if (!isLast) slide.swipe = true;
        }
        return slide;
      });

    // ---------- ExportButton ----------
    function ExportButton({ slides, design, accent }) {
      const stageRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      async function handleExport() {
        if (!stageRef.current) return;
        setBusy(true); setMsg(null);
        try {
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          const nodes = Array.from(stageRef.current.children);
          const zip = new JSZip();
          for (let i = 0; i < nodes.length; i++) {
            const dataUrl = await htmlToImage.toPng(nodes[i], { pixelRatio: 2.7, cacheBust: true, backgroundColor: "#ffffff" });
            zip.file(`carousel-slide-${String(i+1).padStart(2,"0")}.png`, dataUrl.split(",")[1], { base64: true });
            await new Promise(r => setTimeout(r, 50));
          }
          const blob = await zip.generateAsync({ type: "blob" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href = url; a.download = "carousel-slides.zip"; document.body.appendChild(a); a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
          setMsg(`Exported ${nodes.length} slides at 1080x1350 -> carousel-slides.zip`);
          setTimeout(() => setMsg(null), 6000);
        } catch (e) {
          console.error(e);
          setMsg("Export failed. Try Chrome/Edge.");
        } finally { setBusy(false); }
      }
      return (
        <div className="flex flex-col gap-2 items-start">
          <button onClick={handleExport} disabled={busy} className="group relative inline-flex items-center gap-2.5 bg-[#111] text-white rounded-full px-7 h-[48px] text-[14px] font-semibold tracking-[-0.01em] hover:bg-black transition-colors disabled:opacity-60 disabled:cursor-not-allowed shadow-[0_2px_0_0_#FFE600]">
            {busy ? <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : (
              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            )}
            {busy ? "Exporting..." : "Download All Slides (PNG)"}
          </button>
          {msg && <div className="text-[13px] font-medium bg-[#FFE600] text-[#111] px-3.5 py-2 rounded-full flex items-center gap-1.5 max-w-[360px]">{msg}</div>}
          <div ref={stageRef} style={{ position: "fixed", left: "-9999px", top: 0, width: 400, height: "auto", pointerEvents: "none", opacity: 1 }} aria-hidden>
            {slides.map((s, i) => (
              <div key={i} style={{ width: 400, height: 500 }}>
                <SlideView slide={s} index={i} design={design} accent={accent} total={slides.length} />
              </div>
            ))}
          </div>
        </div>
      );
    }

          navigator.clipboard.writeText(json).then(done).catch(fallback);

          const ta = document.createElement("textarea");
          ta.value = json; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch { flash("Copy failed — open the JSON and select it manually."); }

      const [rawText, setRawText] = useState("");
      const [parseMsg, setParseMsg] = useState(null);

      function handleParse() {
        const parsed = parseSlidesText(rawText);
        if (!parsed) { setParseMsg("No slides found. Use '**Slide N — Title**' format."); return; }
        setSlides(parsed);
        setSlidesJson(JSON.stringify(parsed, null, 2));
        setMode("json");
        setParseMsg(`Parsed ${parsed.length} slides. Review in JSON mode.`);
        setTimeout(() => setParseMsg(null), 4000);
      }

      function submit(e) {
        e.preventDefault();
        let finalSlides = slides;
        if (mode === "json") { try { finalSlides = JSON.parse(slidesJson); } catch { alert("Invalid JSON"); return; } }
        const c = { id: uid(), accountId, title: title || "Untitled", scheduledDate: date, status, slides: finalSlides, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        storage.saveCarousel(c);
        nav("carousels-view", { id: c.id });
      }

      const previewSlides = mode === "json" ? (() => { try { return JSON.parse(slidesJson); } catch { return []; } })() : slides;

      return (
        <main className="max-w-6xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-extrabold tracking-tight mb-6">New Carousel</h1>
          <div className="grid md:grid-cols-2 gap-6 mb-6">
            <form onSubmit={submit} className="flex flex-col gap-4">
              <Field label="Title"><input value={title} onChange={e=>setTitle(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
              <Field label="Account">
                <select value={accountId} onChange={e=>setAccountId(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                  {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </Field>
              <Field label="Scheduled date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
              <Field label="Status">
                <select value={status} onChange={e=>setStatus(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                  <option value="draft">draft</option><option value="scheduled">scheduled</option><option value="done">done</option>
                </select>
              </Field>
              <div className="flex gap-2 flex-wrap">
                <button type="button" onClick={() => setMode(mode==="form"?"json":"form")} className="text-xs px-3 py-1.5 rounded-full border border-black/15">{mode==="form"?"Edit as JSON":"Edit as form"}</button>
                <button type="button" onClick={() => setMode(mode==="text"?"form":"text")} className="text-xs px-3 py-1.5 rounded-full border border-black/15 bg-[#FFE600]">{mode==="text"?"Back to form":"Paste as text"}</button>
              </div>
              {mode === "text" && (
                <>
                  <Field label="Paste your slide text (use '**Slide N — Title**' format)">
                    <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={16} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full font-mono" placeholder={"**Slide 1 — Cover**\n\nYour headline here.\n\n**Slide 2 — Title**\n\nBody text..."} />
                  </Field>
                  <div className="flex gap-2 flex-wrap">
                    <button type="button" onClick={handleParse} className="bg-black text-white rounded-full h-9 px-4 text-sm font-semibold hover:bg-black/80">Parse (smart)</button>
                  </div>
                  {parseMsg && <div className="text-sm text-green-600">{parseMsg}</div>}
                  <p className="text-xs opacity-50">Paste your text, then Parse (smart). It converts instantly and works fully offline.</p>
                </>
              )}
              {mode === "json" && <Field label="Slides JSON"><textarea value={slidesJson} onChange={e=>setSlidesJson(e.target.value)} rows={18} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full font-mono" /></Field>}
              <button className="bg-black text-white rounded-full h-10 font-semibold text-sm hover:bg-black/80">Save Carousel</button>
            </form>
            <div className="flex flex-col gap-4">
              <div className="border border-black/10 rounded-xl p-4">
                <h3 className="font-bold mb-2">Preview</h3>
                <div className="flex gap-2 overflow-x-auto pb-2">
                  {previewSlides.slice(0,3).map((s,i) => (
                    <div key={i} className="shrink-0 scale-[0.4] origin-top-left" style={{ width: 400, height: 500, marginRight: -240 }}>
                      <SlideView slide={s} index={i} design={accounts.find(a=>a.id===accountId)?.design || "minimal"} accent={accounts.find(a=>a.id===accountId)?.accentColor || "#FFE600"} total={previewSlides.length} />
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

    // ---------- Carousel view ----------
    function CarouselView({ id, nav }) {
      const [c, setC] = useState(null);
      const [accounts, setAccounts] = useState(storage.listAccounts());
      const [active, setActive] = useState(0);
      useEffect(() => { setC(storage.getCarousel(id)); }, [id]);
      if (!c) return <main className="p-10">Loading...</main>;
      const account = accounts.find(a => a.id === c.accountId);
      const design = account?.design || "minimal";
      const accent = account?.accentColor || "#FFE600";
      function updateStatus(status) {
        const updated = { ...c, status, updatedAt: new Date().toISOString() };
        storage.saveCarousel(updated); setC(updated);
      }
      function remove() { if (!confirm("Delete?")) return; storage.deleteCarousel(c.id); nav("carousels"); }
      return (
        <main className="max-w-6xl mx-auto px-4 py-8">
          <div className="flex items-end justify-between mb-6 flex-wrap gap-3">
            <div>
              <h1 className="text-3xl font-extrabold tracking-tight">{c.title}</h1>
              <p className="text-sm opacity-60">{c.scheduledDate} · {c.status} · {account?.name} · {design}</p>
            </div>
            <div className="flex gap-2 flex-wrap">
              <ExportButton slides={c.slides} design={design} accent={accent} />
              <button onClick={() => updateStatus("done")} className="text-sm px-3 py-1.5 rounded-full border border-black/15 hover:bg-black hover:text-white">Mark done</button>
              <button onClick={remove} className="text-sm px-3 py-1.5 rounded-full border border-red-200 text-red-600 hover:bg-red-600 hover:text-white">Delete</button>
            </div>
          </div>
          <div className="flex gap-4 overflow-x-auto no-scrollbar pb-4">
            {c.slides.map((s, i) => (
              <div key={i} className="shrink-0" style={{ width: 280 }}>
                <div className="scale-[0.7] origin-top-left" style={{ width: 400, height: 500, marginBottom: -150 }}>
                  <SlideView slide={s} index={i} design={design} accent={accent} total={c.slides.length} />
                </div>
              </div>
            ))}
          </div>
          <div className="mt-4 flex gap-2">
            {c.slides.map((_, i) => (
              <button key={i} onClick={() => setActive(i)} className={`h-2 rounded-full transition-all ${active === i ? "w-6 bg-black" : "w-2 bg-black/20"}`} />
            ))}
          </div>
        </main>
      );
    }

    // ---------- Accounts list ----------
    function AccountsPage({ nav }) {
      const [list, setList] = useState(storage.listAccounts());
      function refresh() { setList(storage.listAccounts()); }
      function remove(id) { if (!confirm("Delete account?")) return; storage.deleteAccount(id); refresh(); }
      return (
        <main className="max-w-6xl mx-auto px-4 py-8">
          <div className="flex items-end justify-between mb-6">
            <h1 className="text-3xl font-extrabold tracking-tight">Accounts</h1>
            <button onClick={() => nav("accounts-new")} className="bg-black text-white rounded-full px-5 h-10 inline-flex items-center text-sm font-semibold hover:bg-black/80">+ New Account</button>
          </div>
          <div className="grid gap-3">
            {list.map(a => (
              <div key={a.id} className="border border-black/10 rounded-xl p-4 flex items-center justify-between">
                <div>
                  <div className="font-semibold">{a.name}</div>
                  <div className="text-xs opacity-50">{a.design} · {a.accentColor}</div>
                  {a.prompt && <div className="text-xs opacity-40 mt-1 line-clamp-2 max-w-xl">{a.prompt.slice(0, 120)}</div>}
                </div>
                <div className="flex gap-2">
                  <button onClick={() => nav("accounts-edit", {id: a.id})} className="text-sm px-3 py-1.5 rounded-full border border-black/15 hover:bg-black hover:text-white">Edit</button>
                  <button onClick={() => remove(a.id)} className="text-sm px-3 py-1.5 rounded-full border border-red-200 text-red-600 hover:bg-red-600 hover:text-white">Delete</button>
                </div>
              </div>
            ))}
            {list.length === 0 && <p className="text-sm opacity-50">No accounts yet.</p>}
          </div>
        </main>
      );
    }

    // ---------- Account new ----------
    function AccountNew({ nav }) {
      const [name, setName] = useState("");
      const [design, setDesign] = useState("minimal");
      const [accent, setAccent] = useState("#FFE600");
      const [prompt, setPrompt] = useState("");
      function submit(e) {
        e.preventDefault();
        storage.saveAccount({ id: uid(), name, design, accentColor: accent, prompt, createdAt: new Date().toISOString() });
        nav("accounts");
      }
      return (
        <main className="max-w-2xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-extrabold tracking-tight mb-6">New Account</h1>
          <form onSubmit={submit} className="flex flex-col gap-4">
            <Field label="Account name"><input value={name} onChange={e=>setName(e.target.value)} required className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
            <Field label="Design">
              <select value={design} onChange={e=>setDesign(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                {DESIGNS.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </Field>
            <Field label="Accent color"><input type="color" value={accent} onChange={e=>setAccent(e.target.value)} className="h-10 w-20" /></Field>
            <Field label="Design prompt / style notes"><textarea value={prompt} onChange={e=>setPrompt(e.target.value)} rows={6} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" placeholder="Describe the visual style & tone..." /></Field>
            <button className="bg-black text-white rounded-full h-10 font-semibold text-sm hover:bg-black/80">Save Account</button>
          </form>
        </main>
      );
    }

    // ---------- Account edit ----------
    function AccountEdit({ id, nav }) {
      const [acc, setAcc] = useState(storage.getAccount(id));
      if (!acc) return <main className="p-10">Loading...</main>;
      function submit(e) {
        e.preventDefault();
        storage.saveAccount(acc);
        nav("accounts");
      }
      return (
        <main className="max-w-2xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-extrabold tracking-tight mb-6">Edit Account</h1>
          <form onSubmit={submit} className="flex flex-col gap-4">
            <Field label="Account name"><input value={acc.name} onChange={e=>setAcc({...acc,name:e.target.value})} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
            <Field label="Design">
              <select value={acc.design} onChange={e=>setAcc({...acc,design:e.target.value})} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                {DESIGNS.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
              </select>
            </Field>
            <Field label="Accent color"><input type="color" value={acc.accentColor} onChange={e=>setAcc({...acc,accentColor:e.target.value})} className="h-10 w-20" /></Field>
            <Field label="Design prompt"><textarea value={acc.prompt||""} onChange={e=>setAcc({...acc,prompt:e.target.value})} rows={6} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
            <button className="bg-black text-white rounded-full h-10 font-semibold text-sm hover:bg-black/80">Save</button>
          </form>
        </main>
      );
    }

    // ---------- Settings ----------
    function SettingsPage({ nav }) {
      const [copyMsg, setCopyMsg] = useState(null);
      function copySample() {
        const done = () => { setCopyMsg("Example JSON copied. Paste it into the slides JSON editor."); setTimeout(() => setCopyMsg(null), 4000); };
        function fallbackCopy() {
          const ta = document.createElement("textarea");
          ta.value = SAMPLE_JSON; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch { setCopyMsg("Copy failed — select the JSON below manually."); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(SAMPLE_JSON).then(done).catch(fallbackCopy);
        } else { fallbackCopy(); }
      }
      return (
        <main className="max-w-5xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-extrabold tracking-tight mb-2">Settings</h1>
          <p className="text-sm opacity-60 mb-6">Local-only workspace. Everything is stored in this browser — no accounts, no server, no API keys.</p>

          <div className="border border-black/10 rounded-xl p-4 mb-6 grid sm:grid-cols-3 gap-3 text-xs">
            <div><div className="font-bold mb-1">Storage</div><div className="opacity-60">Browser localStorage</div></div>
            <div><div className="font-bold mb-1">Conversion</div><div className="opacity-60">Parse (smart), fully offline</div></div>
            <div><div className="font-bold mb-1">Look</div><div className="opacity-60">Toggle Dark / Light in the top bar</div></div>
          </div>

          <section className="border border-black/10 rounded-xl p-4">
            <div className="flex items-start justify-between gap-3 flex-wrap mb-1">
              <div>
                <h2 className="text-lg font-bold">Slide JSON Field Reference</h2>
                <p className="text-xs opacity-60">{FIELD_COUNT} fields. Use any of them in a slide object — mix and match freely. Every field is optional except a headline or another content field.</p>
              </div>
              <button type="button" onClick={copySample} className="text-xs px-3 py-1.5 rounded-full bg-black text-white font-semibold hover:bg-black/80">Copy example JSON</button>
            </div>
            {copyMsg && <div className="text-xs text-green-600 mb-2">{copyMsg}</div>}

            {FIELD_GROUPS.map((g) => (
              <div key={g.group} className="mt-4">
                <h3 className="text-xs font-extrabold uppercase tracking-[0.16em] bg-[#FFE600] inline-block px-2 py-1 mb-2">{g.group}</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead><tr className="bg-black/5"><th className="text-left p-2 border border-black/10">Field</th><th className="text-left p-2 border border-black/10">Type</th><th className="text-left p-2 border border-black/10">Used in</th><th className="text-left p-2 border border-black/10">Description / Example</th></tr></thead>
                    <tbody>
                      {g.fields.map((f) => (
                        <tr key={f[0]}>
                          <td className="p-2 border border-black/10 font-mono whitespace-nowrap">{f[0]}</td>
                          <td className="p-2 border border-black/10 whitespace-nowrap">{f[1]}</td>
                          <td className="p-2 border border-black/10 whitespace-nowrap">{f[2]}</td>
                          <td className="p-2 border border-black/10">{f[3]}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}

            <h3 className="text-sm font-bold mt-6 mb-2">Example slide objects</h3>
            <pre className="text-[10px] leading-relaxed bg-black/5 rounded-lg p-3 overflow-x-auto font-mono whitespace-pre">{SAMPLE_JSON}</pre>

            <h3 className="text-sm font-bold mt-6 mb-2">Design prompt (how it works)</h3>
            <p className="text-xs opacity-70 leading-relaxed">
              The "Design prompt" on an Account is a free-text note describing the visual style and tone for that account (e.g. "Minimal educational, typography-first, black/white/yellow"). It is stored with the account as a reference for you — it does not affect rendering. The visual look comes from the Account's Design dropdown, accent color, and any per-slide style fields above (theme, accent, background, font, align, border, radius...). To make a different look permanent, create a new Account.
            </p>
            <h3 className="text-sm font-bold mt-4 mb-2">Tips</h3>
            <ul className="text-xs opacity-70 leading-relaxed list-disc pl-5 space-y-1">
              <li>Use <span className="font-mono">theme: "dark"</span> for a single inverted slide; the Account design still applies to the rest.</li>
              <li>Use <span className="font-mono">layout</span> to change structure without changing content: list, steps, quote, stat, split, checklist, callout, cta.</li>
              <li>Use <span className="font-mono">headlineEmphasis</span> plus <span className="font-mono">emphasisStyle</span> to reproduce the yellow highlighter look.</li>
              <li>Images accept https URLs or data URIs; use <span className="font-mono">imagePosition: "background"</span> with <span className="font-mono">imageOverlay</span> for full-bleed photos.</li>
              <li>Leave a field out entirely to use the default. Booleans default to on for border, divider and watermark.</li>
            </ul>
          </section>
        </main>
      );
    }

    function Field({ label, children }) {
      return <label className="flex flex-col gap-1"><span className="text-xs uppercase tracking-wider opacity-60">{label}</span>{children}</label>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
