          ["ctaUrl", "string", "cta", "URL for the CTA button (printed in exports)."],
          ["handle", "string", "all", "Social handle shown under the CTA. e.g. \"@yourbrand\"."],

      {

          ["footerCenter", "string", "all", "Footer metadata center."],
          ["footerRight", "string", "all", "Footer metadata right (defaults to page)."],
          ["progress", "boolean", "all", "Show a progress bar along the bottom edge."],
          ["progressStyle", "string", "all", "\"bar\" or \"dots\"."],
          ["watermark", "boolean", "all", "Show the giant faint slide number in the corner (default true)."],
          ["cornerLabel", "string", "all", "Small accent label pinned to the top-right corner."],
          ["series", "string", "all", "Series name shown in the footer. e.g. \"SYSTEM 01\"."],

      },
      {

        fields: [
          ["theme", "string", "all", "\"light\", \"dark\", \"accent\". Overrides the account design."],

          ["background", "string", "all", "Slide background color. e.g. \"#EFEFEF\"."],

          ["textCase", "string", "all", "\"normal\" or \"upper\" — uppercases eyebrows, badges and footer."],
          ["letterSpacing", "string", "all", "Headline letter spacing. e.g. \"-0.03em\"."],

    const FIELD_COUNT = FIELD_GROUPS.reduce((n, g) => n + g.fields.length, 0);

    const SAMPLE_JSON = JSON.stringify([
      {
        kind: "cover", layout: "cover", label: "EDUCATIONAL SERIES 01", headerRight: "01 — 09",
        headline: "Start small. Stay in control.", headlineEmphasis: "in control", emphasisStyle: "marker",
        sub: "A 9-step system for scaling AI UGC without losing quality.", eyebrow: "AI UGC / 01",
        badge: "NEW", footerLeft: "SYSTEM 01", page: "01 / 09", pageStyle: "slash", accent: "#FFE600"
      },
      {
        kind: "content", layout: "list", eyebrow: "GETTING STARTED / 02", number: "01 / 08",
        headline: "Research what already works", headlineEmphasis: "already works",
        yellow: "Don't guess what to create.", bulletsTitle: "LOOK FOR",
        bullets: ["Strong hooks", "Winning formats", "Angles that resonate"],
        bulletStyle: "arrow", calloutTitle: "RULE", calloutBody: "Research what earns attention before you produce anything.",
        calloutStyle: "rule", calloutIcon: "→", footerLeft: "PROFESSIONAL PUBLISHING - 01", page: "02 / 09", swipe: true, progress: true
      },
      {
        kind: "content", layout: "steps", eyebrow: "WORKFLOW / 03",
        headline: "Run it in three moves",
        steps: [
          { label: "STEP 01", title: "Choose one task", body: "Start with something low-risk." },
          { label: "STEP 02", title: "Check the output", body: "Inspect before expanding." },
          { label: "STEP 03", title: "Expand carefully", body: "Only after it proves reliable." }
        ],
        footerLeft: "ONE TASK AT A TIME", page: "03 / 09"
      },
      {
        kind: "cta", layout: "cta", eyebrow: "NEXT / 09", badge: "FREE",
        headline: "Want more practical AI UGC strategies?",
        cta: "DM \"UGC\" for more tips.", ctaSub: "I reply to every DM.",
        ctaButton: "Save this post", handle: "@yourbrand", swipe: true,
        footerLeft: "Save for later use", page: "09 / 09", theme: "dark", accent: "#FFE600"
      }
    ], null, 2);
    function parseSlidesText(text) {
      const slideRegex = /\*\*Slide\s+(\d+)\s*[—–\-]\s*(.+?)\*\*/g;
      const matches = [...text.matchAll(slideRegex)];
      if (matches.length === 0) return null;
      const parsed = [];
      for (let i = 0; i < matches.length; i++) {
        const m = matches[i];
        const title = m[2].trim();
        const start = m.index + m[0].length;
        const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
        const body = text.slice(start, end).trim();
        parsed.push({ title, body });
      }
      const total = parsed.length;
      const contentCount = total - 1;
      return parsed.map((s, idx) => {
        const isFirst = idx === 0;
        const isLast = idx === total - 1;
        const kind = isFirst ? "cover" : (isLast ? "cta" : "content");
        const allLines = s.body.split("\n").map(l => l.trim()).filter(Boolean);
        const bullets = [];
        const textLines = [];
        let bulletsTitle = "";
        for (const l of allLines) {
          if (/^[-*•]\s/.test(l)) bullets.push(l.replace(/^[-*•]\s*/, "").trim());
          else if (/^[A-Za-z][^.!?]{0,40}:$/.test(l) && bullets.length === 0 && textLines.length > 0) bulletsTitle = l.replace(/:$/, "");
          else textLines.push(l);
        }
        const bodyText = textLines.join(" ");
        const sentences = bodyText.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(Boolean);
        const titleIsGeneric = /^(cover|intro|introduction|title|cta|conclusion|final|final slide)$/i.test(s.title);
        const slide = { kind, page: `${String(idx+1).padStart(2,"0")} / ${String(total).padStart(2,"0")}` };
        if (isFirst) {
          slide.layout = "cover";
          slide.label = "EDUCATIONAL SERIES 01";
          if (titleIsGeneric) {
            slide.headline = sentences[0] || s.title;
            slide.sub = sentences.slice(1).join(" ");
          } else {
            slide.headline = s.title;
            slide.sub = bodyText || "";
          }
          slide.footerLeft = "SYSTEM 01";
        } else if (isLast) {
          slide.layout = "cta";
          slide.number = `${pad2(contentCount)} / ${pad2(contentCount)} + NEXT`;
          const ctaGeneric = titleIsGeneric || /^cta$/i.test(s.title);
          if (ctaGeneric) {
            slide.headline = sentences[0] || s.title;
            slide.cta = sentences.slice(1).join(" ") || (bullets[0] || "");
          } else {
            slide.headline = s.title;
            if (sentences.length > 1) slide.cta = sentences.slice(1).join(" ");
            else if (bullets.length) slide.cta = bullets[0];
            else if (bodyText) slide.cta = bodyText;
          }
          if (bullets.length > 1) slide.bullets = bullets.slice(1);
          else if (bullets.length === 1 && slide.cta !== bullets[0]) slide.bullets = bullets;
          slide.footerLeft = "Save for later use";
        } else {
          slide.layout = "list";
          slide.number = `${pad2(idx)} / ${pad2(contentCount)}`;
          slide.headline = s.title;
          if (bulletsTitle) slide.bulletsTitle = bulletsTitle;
          const keySentence = sentences.filter(x => x.length <= 120).sort((a, b) => a.length - b.length)[0];
          if (bullets.length) {
            const yellow = keySentence || bullets[0] || "";
            if (yellow) slide.yellow = yellow;
            slide.bullets = bullets;
          } else if (sentences.length > 1) {
            const last = sentences[sentences.length - 1];
            const key = last.length <= 140 ? last : (keySentence || last);
            if (key) slide.yellow = key;
            slide.bullets = sentences.filter(x => x !== key).slice(0, 4);
          } else if (bodyText) {
            slide.yellow = bodyText;
          }
          slide.footerLeft = `PROFESSIONAL PUBLISHING - ${String(idx).padStart(2,"0")}`;
          if (!isLast) slide.swipe = true;
        }
        return slide;
      });
    }

    const defaultSlides = () => ([
      { kind: "cover", label: "EDUCATIONAL SERIES 01", headline: "Your headline here.", sub: "A short subtitle.", page: "01 / 07", footerLeft: "SYSTEM 01" },
      { kind: "content", number: "01 / 06", headline: "First insight headline.", yellow: "Key insight highlight.", bullets: ["Action one.", "Action two.", "Action three."], page: "02 / 07", footerLeft: "PROFESSIONAL PUBLISHING - 01" },
      { kind: "content", number: "02 / 06", headline: "Second insight headline.", yellow: "Key insight highlight.", bullets: ["Action one.", "Action two.", "Action three."], page: "03 / 07", footerLeft: "PROFESSIONAL PUBLISHING - 02" },
      { kind: "content", number: "03 / 06", headline: "Third insight headline.", yellow: "Key insight highlight.", bullets: ["Action one.", "Action two.", "Action three."], page: "04 / 07", footerLeft: "PROFESSIONAL PUBLISHING - 03" },
      { kind: "content", number: "04 / 06", headline: "Fourth insight headline.", yellow: "Key insight highlight.", bullets: ["Action one.", "Action two.", "Action three."], page: "05 / 07", footerLeft: "PROFESSIONAL PUBLISHING - 04" },
      { kind: "content", number: "05 / 06", headline: "Fifth insight headline.", yellow: "Key insight highlight.", bullets: ["Action one.", "Action two.", "Action three."], page: "06 / 07", footerLeft: "PROFESSIONAL PUBLISHING - 05" },
      { kind: "cta", number: "06 / 06 + NEXT", headline: "Closing call to action.", yellow: "Small system, repeated daily.", bullets: ["Pick one action.", "Schedule it.", "Share with someone."], page: "07 / 07", footerLeft: "Save for later use" },
    ]);

    // ---------- Storage (localStorage) ----------
    const LS = { accounts: "cd_accounts", carousels: "cd_carousels", settings: "cd_settings", sb: "cd_supabase_config" };
    const load = (k) => { try { return JSON.parse(localStorage.getItem(k) || "[]"); } catch { return []; } };
    const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    const storage = {
      listAccounts: () => load(LS.accounts),
      saveAccount: (a) => { const all = load(LS.accounts); const i = all.findIndex(x=>x.id===a.id); if(i>=0) all[i]=a; else all.unshift(a); save(LS.accounts, all); },
      deleteAccount: (id) => save(LS.accounts, load(LS.accounts).filter(a=>a.id!==id)),
      getAccount: (id) => load(LS.accounts).find(a=>a.id===id) || null,

      listCarousels: () => load(LS.carousels),
      getCarousel: (id) => load(LS.carousels).find(c=>c.id===id) || null,
      saveCarousel: (c) => { const all = load(LS.carousels); const i = all.findIndex(x=>x.id===c.id); if(i>=0) all[i]=c; else all.unshift(c); save(LS.carousels, all); },
      deleteCarousel: (id) => save(LS.carousels, load(LS.carousels).filter(c=>c.id!==id)),

      getSettings: () => { const all = load(LS.settings); return all[0] || { aiProvider: "openai", aiApiKey: "" }; },
      saveSettings: (s) => save(LS.settings, [s]),
      getSb: () => { try { return JSON.parse(localStorage.getItem(LS.sb) || "null"); } catch { return null; } },
      setSb: (c) => { if (c) localStorage.setItem(LS.sb, JSON.stringify(c)); else localStorage.removeItem(LS.sb); },
    };

    function parseJsonLoose(text) {
      let t = String(text || "").trim().replace(/```json/gi, "").replace(/```/g, "").trim();
      try { return JSON.parse(t); } catch (e) {}
      const start = t.indexOf("{");
      const end = t.lastIndexOf("}");
      if (start >= 0 && end > start) {
        const sliced = t.slice(start, end + 1);
        try { return JSON.parse(sliced); } catch (e) {}
      }
      throw new Error("AI returned invalid JSON. Try again, or use Parse (smart).");
    }

    function aiErrorMessage(e) {
      const m = e && e.message ? e.message : "";
      if (/Failed to fetch|NetworkError|Load failed|Network request failed/i.test(m)) {
        return "Network blocked: the browser could not reach the AI provider. Some providers block direct calls from local files. Use Parse (smart) instead — it works fully offline.";
      }
      return m || "Request failed";
    }

    // ---------- AI generation ----------
    async function generateCarousel(topic, designPrompt, provider, apiKey) {
      const system = `You are a social media carousel content writer. Output ONLY valid JSON. Shape: {"title":"...","slides":[{"kind":"cover","layout":"cover","label":"EDUCATIONAL SERIES 01","headline":"...","sub":"...","page":"01 / 07","footerLeft":"..."},{"kind":"content","layout":"list","number":"01 / 06","headline":"...","headlineEmphasis":"key phrase","yellow":"key insight","bullets":["a","b","c"],"calloutTitle":"RULE","calloutBody":"...","page":"02 / 07","footerLeft":"..."},...{"kind":"cta","layout":"cta","number":"06 / 06 + NEXT","headline":"...","cta":"DM \\"WORD\\" for more","ctaButton":"Save this post","page":"07 / 07","footerLeft":"..."}]}. Exactly 7 slides: 1 cover + 5 content + 1 cta. Headlines as outcomes. Bullets as executable actions. Optional fields you may use: layout, eyebrow, headerRight, headlineLines, headlineEmphasis, emphasisStyle, sub, lead, body, badge, pill, tags, chips, bulletsTitle, bulletStyle, checklist, steps, quote, quoteAuthor, stat, statLabel, calloutTitle, calloutBody, cta, ctaSub, ctaButton, handle, swipe, series. Never use fields outside this list.`;
      const userMsg = `Topic: ${topic}\nDesign/style: ${designPrompt || "Minimal educational."}\nGenerate now.`;
      let text = "";
      const isOpenAICompat = provider === "openai" || provider === "groq";
      if (isOpenAICompat) {
        const base = provider === "groq" ? "https://api.groq.com/openai/v1" : "https://api.openai.com/v1";
        const model = provider === "groq" ? "llama-3.3-70b-versatile" : "gpt-4o-mini";
        const res = await fetch(`${base}/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` },
          body: JSON.stringify({ model, messages: [{role:"system",content:system},{role:"user",content:userMsg}], temperature: 0.7 }),
        });
        if (!res.ok) throw new Error(`${provider} ${res.status}: ${await res.text()}`);
        const j = await res.json();
        text = j.choices?.[0]?.message?.content || "";
      } else {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
          body: JSON.stringify({ model: "claude-3-5-haiku-latest", max_tokens: 2000, system, messages: [{role:"user",content:userMsg}] }),
        });
        if (!res.ok) throw new Error(`Anthropic ${res.status}: ${await res.text()}`);
        const j = await res.json();
        text = j.content?.[0]?.text || "";
      }
      const parsed = parseJsonLoose(text);
      const slides = (parsed.slides || []).map(s => ({ ...s, kind: s.kind || "content" }));
      return { title: parsed.title || topic, slides };
    }

    // ---------- SlideView ----------
    function emphasisNodes(text, slide, accent) {
      if (text === undefined || text === null) return null;
      const em = slide.headlineEmphasis;
      if (!em) return text;
      const str = String(text);
      const idx = str.toLowerCase().indexOf(String(em).toLowerCase());
      if (idx < 0) return str;
      const before = str.slice(0, idx);
      const mid = str.slice(idx, idx + String(em).length);
      const after = str.slice(idx + String(em).length);
      const style = slide.emphasisStyle || "marker";
      if (style === "none") return str;
      const color = slide.emphasisColor || accent;
      const st = style === "underline"
        ? { backgroundImage: `linear-gradient(${color},${color})`, backgroundRepeat: "no-repeat", backgroundSize: "100% 30%", backgroundPosition: "0 90%" }
        : style === "box"
          ? { background: color, padding: "0 3px", borderRadius: 2 }
          : { background: color, padding: "0 2px", boxDecorationBreak: "clone", WebkitBoxDecorationBreak: "clone" };
      return <>{before}<span style={st}>{mid}</span>{after}</>;
    }

    function SlideView({ slide, index, design, accent: accentProp, total }) {
      const s = slide || {};
      const kind = s.kind || "content";
      const dark = s.theme ? s.theme === "dark" : design === "bold";
      const accent = s.accent || accentProp || "#FFE600";
      const bg = s.background || (dark ? "#111111" : "#FFFFFF");
      const fg = s.textColor || (dark ? "#FFFFFF" : "#111111");
      const muted = s.mutedColor || (dark ? "rgba(255,255,255,0.55)" : "rgba(17,17,17,0.5)");
      const fontFamily = s.serif || s.font === "serif" ? "'EB Garamond', Georgia, serif" : s.font === "mono" ? "ui-monospace, SFMono-Regular, Menlo, monospace" : "Inter, system-ui, sans-serif";
      const align = s.align === "center" ? "center" : "left";
      const marker = s.textCase === "upper" ? "uppercase" : "none";
      const layout = s.layout || (kind === "cover" ? "cover" : kind === "cta" ? "cta" : "content");
      const isCover = kind === "cover" || layout === "cover";
      const imgPos = s.imagePosition || "top";
      const bullets = Array.isArray(s.bullets) ? s.bullets : [];
      const steps = Array.isArray(s.steps) ? s.steps : [];
      const checklist = Array.isArray(s.checklist) ? s.checklist : [];
      const tags = Array.isArray(s.tags) ? s.tags : [];
      const chips = Array.isArray(s.chips) ? s.chips : [];
      const pageText = (() => {
        if (s.page) return s.page;
        if (!total) return "";
        if (s.pageStyle === "dash") return `${pad2(index + 1)} — ${pad2(total)}`;
        if (s.pageStyle === "dots") return `• ${pad2(index + 1)} / ${pad2(total)}`;
        return `${pad2(index + 1)} / ${pad2(total)}`;
      })();
      const bulletGlyph = { arrow: "→", dot: "•", dash: "–", check: "✓" }[s.bulletStyle] || "→";
      const headlineSize = isCover || layout === "statement" ? 30 : layout === "quote" ? 26 : 28;
      const bodyAlign = align;
      const hasBackgroundImage = !!(s.backgroundImage || (s.image && imgPos === "background"));
      const bgImage = s.backgroundImage || (imgPos === "background" ? s.image : "");
      const imgStyle = { width: "100%", objectFit: s.imageFit || "cover", borderRadius: 3, display: "block" };
      const contentRef = useRef(null);
      const [fitScale, setFitScale] = useState(1);
      useEffect(() => {
        const el = contentRef.current;
        if (!el || !el.parentElement) return;
        el.style.transform = "none";
        el.style.width = "100%";
        const avail = el.parentElement.clientHeight;
        const h = el.scrollHeight;
        if (h > avail && h > 0) setFitScale(Math.max(0.6, avail / h));
        else setFitScale(1);
      }, [JSON.stringify(s), total]);

      const imageBlock = (height, captionBelow) => s.image && imgPos !== "background" ? (
        <div style={{ width: "100%", flexShrink: 0 }}>
          <img src={s.image} alt={s.imageAlt || ""} style={{ ...imgStyle, height }} />

        </div>

      const content = (
        <div style={{ position: "relative", zIndex: 1, display: "flex", flexDirection: "column", height: "100%" }}>
          <div style={{ flex: 1, minHeight: 0, overflow: "hidden", position: "relative" }}>

                  <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: "0.18em", textTransform: "uppercase", color: muted, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    {s.eyebrow || (isCover ? (s.label || "") : (s.number || s.series || ""))}
                  </span>
                </div>

                      </ul>

                    {checklist.length > 0 && (
                      <ul style={{ listStyle: "none", margin: 0, padding: 0, display: "flex", flexDirection: "column", gap: 8 }}>
                        {checklist.map((b, i) => (

                            <span style={{ width: 11, height: 11, border: `1.5px solid ${fg}`, borderRadius: 2, flexShrink: 0, marginTop: 1, display: "inline-flex", alignItems: "center", justifyContent: "center", fontSize: 8, fontWeight: 800, color: accent }}>✓</span>
                            <span>{b}</span>
                          </li>
                        ))}
                      </ul>
                    )}
                  </div>
                )}

                {steps.length > 0 && (
                  <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(steps.length, 3)}, 1fr)`, gap: 10, marginTop: 18 }}>
                    {steps.slice(0, 3).map((st, i) => (
                      <div key={i} style={{ borderTop: `1.8px solid ${fg}`, paddingTop: 6, textAlign: "left" }}>
                        <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: "0.1em", textTransform: "uppercase", color: muted }}>{st.label || `STEP ${pad2(i + 1)}`}</div>
                        <div style={{ fontSize: 10.5, fontWeight: 700, marginTop: 3, lineHeight: 1.2 }}>{st.title}</div>
                        {st.body && <div style={{ fontSize: 8.5, color: muted, marginTop: 3, lineHeight: 1.3 }}>{st.body}</div>}
                      </div>
                    ))}

                {tags.length > 0 && (
                  <div style={{ marginTop: 14, fontSize: 10, fontWeight: 600, color: accent, letterSpacing: "0.02em", textAlign: bodyAlign }}>{tags.map(t => String(t).startsWith("#") ? t : `#${t}`).join("  ")}</div>
                )}
                {chips.length > 0 && (
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginTop: 12, justifyContent: align === "center" ? "center" : "flex-start" }}>
                    {chips.map((c, i) => (
                      <span key={i} style={{ border: `1px solid ${muted}`, borderRadius: 20, padding: "3px 8px", fontSize: 8.5, fontWeight: 600, color: fg }}>{c}</span>
                    ))}

                )}

                {(s.calloutTitle || s.calloutBody) && (
                  <div style={{ marginTop: 16, borderLeft: `3px solid ${s.calloutStyle === "warning" ? "#E5484D" : s.calloutStyle === "tip" ? accent : fg}`, paddingLeft: 10, background: dark ? "rgba(255,255,255,0.04)" : "rgba(0,0,0,0.025)", padding: "9px 10px" }}>
                    {s.calloutTitle && <div style={{ fontSize: 9.5, fontWeight: 800, letterSpacing: "0.08em", textTransform: "uppercase", marginBottom: 3 }}>{s.calloutIcon ? `${s.calloutIcon} ` : ""}{s.calloutTitle}</div>}
                    {s.calloutBody && <div style={{ fontSize: 9.5, lineHeight: 1.38, color: muted }}>{s.calloutBody}</div>}
                  </div>
                )}

                {s.note && <p style={{ fontSize: 9.5, lineHeight: 1.4, color: muted, marginTop: 12, marginBottom: 0 }}>{s.note}</p>}
                {s.footnote && <p style={{ fontSize: 8, lineHeight: 1.3, color: muted, marginTop: 10, marginBottom: 0 }}>{s.footnote}</p>}

                {(s.cta || s.ctaSub || s.ctaButton || s.handle) && (
                  <div style={{ marginTop: 18 }}>
                    {s.cta && <div style={{ fontSize: isCover ? 18 : 16, fontWeight: 800, lineHeight: 1.2, maxWidth: "96%" }}>{s.cta}</div>}
                    {s.ctaSub && <div style={{ fontSize: 10.5, color: muted, marginTop: 6, lineHeight: 1.35 }}>{s.ctaSub}</div>}
                    {s.ctaButton && (
                      <div style={{ display: "inline-block", marginTop: 12, background: accent, color: "#111", borderRadius: 30, padding: "8px 16px", fontSize: 10.5, fontWeight: 800, letterSpacing: "0.01em" }}>{s.ctaButton}</div>
                    )}
                    {s.ctaUrl && <div style={{ fontSize: 8, color: muted, marginTop: 6, wordBreak: "break-all" }}>{s.ctaUrl}</div>}
                    {s.handle && <div style={{ fontSize: 10, fontWeight: 700, marginTop: 10, letterSpacing: "0.04em" }}>{s.handle}</div>}
                  </div>
                )}
              </div>
              {(imgPos === "right") && <div style={{ width: 120, flexShrink: 0 }}>{imageBlock(150, false)}</div>}
            </div>

            {imgPos === "bottom" && !!s.image && <div style={{ marginTop: 16 }}>{imageBlock(92, true)}</div>}

            {s.disclaimer && <div style={{ fontSize: 7.5, lineHeight: 1.3, color: muted, marginTop: 12 }}>{s.disclaimer}</div>}
          </div>
          </div>

          {!s.hideFooter && (
            <div style={{ marginTop: 14 }}>
              {s.divider !== false && <div style={{ width: "100%", height: 1, background: fg, opacity: 0.85, marginBottom: 8 }} />}
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 8.5, letterSpacing: "0.12em", textTransform: "uppercase", opacity: 0.55, fontWeight: 500, maxWidth: "45%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.footerLeft || s.series || ""}</span>
                {s.footerCenter && <span style={{ fontSize: 8.5, letterSpacing: "0.12em", textTransform: "uppercase", opacity: 0.45, maxWidth: "30%", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{s.footerCenter}</span>}
                <span style={{ fontSize: 8.5, letterSpacing: "0.12em", textTransform: "uppercase", opacity: 0.55, fontWeight: 500, whiteSpace: "nowrap" }}>{s.footerRight || pageText}</span>
              </div>
              {(s.swipe || s.swipeText) && (
                <div style={{ textAlign: "right", marginTop: 5, fontSize: 8, fontWeight: 800, letterSpacing: "0.14em", textTransform: "uppercase", color: accent }}>{s.swipeText || "SWIPE →"}</div>
              )}
            </div>
          )}
        </div>
      );

      return (
        <div className="relative w-full h-full overflow-hidden select-none" style={{
          width: 400, height: 500, padding: "38px 34px", background: bg, color: fg, fontFamily,
          border: s.border === false ? "none" : `1.5px solid ${dark ? "rgba(255,255,255,0.25)" : "#111"}`,
          borderRadius: s.radius || 0, boxSizing: "border-box"
        }}>
          {bgImage && (
            <>
              <img src={bgImage} alt={s.imageAlt || ""} style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: s.imageFit || "cover" }} />
              <div style={{ position: "absolute", inset: 0, background: dark ? "#111" : "#fff", opacity: s.imageOverlay !== undefined ? s.imageOverlay : 0.55 }} />
            </>
          )}
          {s.grain && <div style={{ position: "absolute", inset: 0, opacity: 0.06, backgroundImage: "radial-gradient(rgba(0,0,0,0.9) 0.5px, transparent 0.5px)", backgroundSize: "4px 4px", pointerEvents: "none" }} />}
          {s.overlayOpacity !== undefined && <div style={{ position: "absolute", inset: 0, background: fg, opacity: 1 - s.overlayOpacity, pointerEvents: "none" }} />}
          {content}
          {s.watermark !== false && (
            <div className="pointer-events-none absolute -right-2 -bottom-1 text-[120px] font-[800] leading-none opacity-[0.02] select-none">
              {pad2(index + 1)}
            </div>
          )}
          {s.progress && (
            <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, height: 3, background: dark ? "rgba(255,255,255,0.15)" : "rgba(0,0,0,0.1)" }}>
              <div style={{ width: `${total ? ((index + 1) / total) * 100 : 0}%`, height: "100%", background: accent }} />
            </div>
          )}
        </div>
      );
    }

    // ---------- ExportButton ----------
    function ExportButton({ slides, design, accent }) {
      const stageRef = useRef(null);
      const [busy, setBusy] = useState(false);
      const [msg, setMsg] = useState(null);
      async function handleExport() {
        if (!stageRef.current) return;
        setBusy(true); setMsg(null);
        try {
          if (document.fonts && document.fonts.ready) await document.fonts.ready;
          const nodes = Array.from(stageRef.current.children);
          const zip = new JSZip();
          for (let i = 0; i < nodes.length; i++) {
            const dataUrl = await htmlToImage.toPng(nodes[i], { pixelRatio: 2.7, cacheBust: true, backgroundColor: "#ffffff" });
            zip.file(`carousel-slide-${String(i+1).padStart(2,"0")}.png`, dataUrl.split(",")[1], { base64: true });
            await new Promise(r => setTimeout(r, 50));
          }
          const blob = await zip.generateAsync({ type: "blob" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a"); a.href = url; a.download = "carousel-slides.zip"; document.body.appendChild(a); a.click();
          setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
          setMsg(`Exported ${nodes.length} slides at 1080x1350 -> carousel-slides.zip`);
          setTimeout(() => setMsg(null), 6000);
        } catch (e) {
          console.error(e);
          setMsg("Export failed. Try Chrome/Edge.");
        } finally { setBusy(false); }
      }
      return (
        <div className="flex flex-col gap-2 items-start">
          <button onClick={handleExport} disabled={busy} className="group relative inline-flex items-center gap-2.5 bg-[#111] text-white rounded-full px-7 h-[48px] text-[14px] font-semibold tracking-[-0.01em] hover:bg-black transition-colors disabled:opacity-60 disabled:cursor-not-allowed shadow-[0_2px_0_0_#FFE600]">
            {busy ? <span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin" /> : (
              <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
            )}
            {busy ? "Exporting..." : "Download All Slides (PNG)"}
          </button>
          {msg && <div className="text-[13px] font-medium bg-[#FFE600] text-[#111] px-3.5 py-2 rounded-full flex items-center gap-1.5 max-w-[360px]">{msg}</div>}
          <div ref={stageRef} style={{ position: "fixed", left: "-9999px", top: 0, width: 400, height: "auto", pointerEvents: "none", opacity: 1 }} aria-hidden>
            {slides.map((s, i) => (
              <div key={i} style={{ width: 400, height: 500 }}>
                <SlideView slide={s} index={i} design={design} accent={accent} total={slides.length} />
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ---------- Nav ----------
    function Nav({ route, setRoute }) {
      const links = [{id:"home",label:"Dashboard"},{id:"calendar",label:"Calendar"},{id:"carousels",label:"Carousels"},{id:"accounts",label:"Accounts"},{id:"settings",label:"Settings"}];

        <nav className="border-b border-black/10 bg-white sticky top-0 z-20">
          <div className="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between flex-wrap gap-2">
            <button onClick={() => setRoute("home")} className="font-extrabold tracking-tight text-lg">Carousel<span className="text-[#FFE600] bg-black px-1 ml-1 rounded">DB</span></button>
            <div className="flex items-center gap-1 flex-wrap">
              {links.map(l => (
                <button key={l.id} onClick={() => setRoute(l.id)} className={`px-3 py-1.5 rounded-full text-sm font-medium transition-colors ${route===l.id ? "bg-black text-white" : "hover:bg-black/5"}`}>{l.label}</button>
              ))}
            </div>
            <div className="flex items-center gap-3">
              <span className="text-xs opacity-50 hidden md:inline">local@local</span>

    // ---------- App (router via state) ----------
    function App() {
      const [route, setRoute] = useState("home");
      const [params, setParams] = useState({});
      const nav = (r, p = {}) => { setRoute(r); setParams(p); };

      let page = null;
      if (route === "home") page = <Home nav={nav} />;
      else if (route === "calendar") page = <CalendarPage nav={nav} />;
      else if (route === "carousels") page = <CarouselsPage nav={nav} />;
      else if (route === "carousels-new") page = <CarouselNew nav={nav} />;
      else if (route === "carousels-view") page = <CarouselView id={params.id} nav={nav} />;
      else if (route === "accounts") page = <AccountsPage nav={nav} />;
      else if (route === "accounts-new") page = <AccountNew nav={nav} />;
      else if (route === "accounts-edit") page = <AccountEdit id={params.id} nav={nav} />;
      else if (route === "settings") page = <SettingsPage nav={nav} />;

      return (
        <div className="min-h-screen bg-white">
          <Nav route={route} setRoute={(r) => nav(r)} />
          {page}
        </div>
      );
    }

              <h1 className="text-3xl font-extrabold tracking-tight">Dashboard</h1>
              <p className="text-sm opacity-60">Your carousel content calendar at a glance.</p>
            </div>
            <button onClick={() => nav("carousels-new")} className="bg-black text-white rounded-full px-5 h-10 inline-flex items-center text-sm font-semibold hover:bg-black/80">+ New Carousel</button>
          </div>
          <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <Stat label="Carousels" value={carousels.length} />
            <Stat label="Accounts" value={accounts.length} />
            <Stat label="Scheduled" value={carousels.filter(c=>c.status==="scheduled").length} />

                <div>
                  <div className="font-semibold">{c.title}</div>

    // ---------- Carousel new ----------
    function CarouselNew({ nav }) {
      const accounts = storage.listAccounts();
      const [accountId, setAccountId] = useState(accounts[0]?.id || "");
      const [title, setTitle] = useState("");
      const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
      const [status, setStatus] = useState("draft");
      const [slides, setSlides] = useState(defaultSlides());
      const [slidesJson, setSlidesJson] = useState(JSON.stringify(defaultSlides(), null, 2));
      const [mode, setMode] = useState("form");
      const [rawText, setRawText] = useState("");
      const [topic, setTopic] = useState("");
      const [genBusy, setGenBusy] = useState(false);
      const [genErr, setGenErr] = useState(null);
      const [parseMsg, setParseMsg] = useState(null);

      async function handleGenerate() {
        if (!topic.trim()) return;
        setGenBusy(true); setGenErr(null);
        try {
          const settings = storage.getSettings();
          const provider = settings.aiProvider || "openai";
          const apiKey = settings.aiApiKey || "";
          if (!apiKey) throw new Error("No AI API key set. Go to Settings first.");
          const acc = accounts.find(a => a.id === accountId);
          const res = await generateCarousel(topic, acc?.prompt, provider, apiKey);
          setSlides(res.slides);
          setSlidesJson(JSON.stringify(res.slides, null, 2));
          if (!title) setTitle(res.title);
        } catch (e) { setGenErr(aiErrorMessage(e)); }
        finally { setGenBusy(false); }
      }

      function handleParse() {
        const parsed = parseSlidesText(rawText);
        if (!parsed) { setParseMsg("No slides found. Use '**Slide N — Title**' format."); return; }
        setSlides(parsed);
        setSlidesJson(JSON.stringify(parsed, null, 2));
        setMode("json");
        setParseMsg(`Parsed ${parsed.length} slides. Review in JSON mode.`);
        setTimeout(() => setParseMsg(null), 4000);
      }
      async function handleAIConvert() {
        if (!rawText.trim()) return;
        setGenBusy(true); setGenErr(null);
        try {
          const settings = storage.getSettings();
          const provider = settings.aiProvider || "openai";
          const apiKey = settings.aiApiKey || "";
          if (!apiKey) throw new Error("No AI API key set. Go to Settings first.");
          const acc = accounts.find(a => a.id === accountId);
          const prompt = `Convert the following raw carousel text into the slide JSON schema. Output ONLY valid JSON with {"title":"...","slides":[...]}. Each slide: kind (cover/content/cta), layout, headline, headlineEmphasis, sub, lead, body, yellow, bullets, checklist, steps, quote, stat, calloutTitle, calloutBody, cta, ctaButton, page, footerLeft, label/number as appropriate. Keep the author's wording; do not invent facts. 7-9 slides.\n\nRaw text:\n${rawText}\n\nDesign style: ${acc?.prompt || "Minimal educational."}`;
          const system = "You convert raw carousel text into structured slide JSON. Output only valid JSON.";
          let text = "";
          const isOpenAICompat = provider === "openai" || provider === "groq";
          if (isOpenAICompat) {
            const base = provider === "groq" ? "https://api.groq.com/openai/v1" : "https://api.openai.com/v1";
            const model = provider === "groq" ? "llama-3.3-70b-versatile" : "gpt-4o-mini";
            const res = await fetch(`${base}/chat/completions`, { method: "POST", headers: { "Content-Type": "application/json", Authorization: `Bearer ${apiKey}` }, body: JSON.stringify({ model, messages: [{role:"system",content:system},{role:"user",content:prompt}], temperature: 0.5 }) });
            if (!res.ok) throw new Error(`${provider} ${res.status}`);
            const j = await res.json(); text = j.choices?.[0]?.message?.content || "";
          } else {
            const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-3-5-haiku-latest", max_tokens: 3000, system, messages: [{role:"user",content:prompt}] }) });
            if (!res.ok) throw new Error(`Anthropic ${res.status}`);
            const j = await res.json(); text = j.content?.[0]?.text || "";
          }
          const parsed = parseJsonLoose(text);
          const slides = (parsed.slides || []).map(s => ({ ...s, kind: s.kind || "content" }));
          setSlides(slides);
          setSlidesJson(JSON.stringify(slides, null, 2));
          setMode("json");
          if (parsed.title && !title) setTitle(parsed.title);
          setParseMsg(`AI converted ${slides.length} slides. Review in JSON mode.`);
          setTimeout(() => setParseMsg(null), 4000);
        } catch (e) { setGenErr(aiErrorMessage(e)); }
        finally { setGenBusy(false); }
      }

      function submit(e) {
        e.preventDefault();
        let finalSlides = slides;
        if (mode === "json") { try { finalSlides = JSON.parse(slidesJson); } catch { alert("Invalid JSON"); return; } }
        const c = { id: uid(), accountId, title: title || "Untitled", scheduledDate: date, status, slides: finalSlides, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() };
        storage.saveCarousel(c);
        nav("carousels-view", { id: c.id });
      }

      const previewSlides = mode === "json" ? (() => { try { return JSON.parse(slidesJson); } catch { return []; } })() : slides;

      return (
        <main className="max-w-6xl mx-auto px-4 py-8">
          <h1 className="text-3xl font-extrabold tracking-tight mb-6">New Carousel</h1>
          <div className="grid md:grid-cols-2 gap-6 mb-6">
            <form onSubmit={submit} className="flex flex-col gap-4">
              <Field label="Title"><input value={title} onChange={e=>setTitle(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
              <Field label="Account">
                <select value={accountId} onChange={e=>setAccountId(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                  {accounts.map(a => <option key={a.id} value={a.id}>{a.name}</option>)}
                </select>
              </Field>
              <Field label="Scheduled date"><input type="date" value={date} onChange={e=>setDate(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" /></Field>
              <Field label="Status">
                <select value={status} onChange={e=>setStatus(e.target.value)} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full">
                  <option value="draft">draft</option><option value="scheduled">scheduled</option><option value="done">done</option>
                </select>
              </Field>
              <div className="flex gap-2 flex-wrap">
                <button type="button" onClick={() => setMode(mode==="form"?"json":"form")} className="text-xs px-3 py-1.5 rounded-full border border-black/15">{mode==="form"?"Edit as JSON":"Edit as form"}</button>
                <button type="button" onClick={() => setMode(mode==="text"?"form":"text")} className="text-xs px-3 py-1.5 rounded-full border border-black/15 bg-[#FFE600]">{mode==="text"?"Back to form":"Paste as text"}</button>
              </div>
              {mode === "text" && (
                <>
                  <Field label="Paste your slide text (use '**Slide N — Title**' format)">
                    <textarea value={rawText} onChange={e=>setRawText(e.target.value)} rows={16} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full font-mono" placeholder={"**Slide 1 — Cover**\n\nYour headline here.\n\n**Slide 2 — Title**\n\nBody text..."} />
                  </Field>
                  <div className="flex gap-2 flex-wrap">
                    <button type="button" onClick={handleParse} className="bg-black text-white rounded-full h-9 px-4 text-sm font-semibold hover:bg-black/80">Parse (smart)</button>
                    <button type="button" onClick={handleAIConvert} disabled={genBusy} className="bg-[#FFE600] text-black rounded-full h-9 px-4 text-sm font-semibold hover:bg-[#ffd700] disabled:opacity-60">{genBusy ? "Converting..." : "Convert with AI"}</button>
                  </div>
                  {parseMsg && <div className="text-sm text-green-600">{parseMsg}</div>}
                  {genErr && <div className="text-red-600 text-xs">{genErr}</div>}
                  <p className="text-xs opacity-50">"Parse (smart)" converts instantly without AI. "Convert with AI" uses your API key for better accuracy.</p>
                </>
              )}
              {mode === "json" && <Field label="Slides JSON"><textarea value={slidesJson} onChange={e=>setSlidesJson(e.target.value)} rows={18} className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full font-mono" /></Field>}
              <button className="bg-black text-white rounded-full h-10 font-semibold text-sm hover:bg-black/80">Save Carousel</button>
            </form>
            <div className="flex flex-col gap-4">
              <div className="border border-black/10 rounded-xl p-4">
                <h3 className="font-bold mb-2">Generate with AI</h3>
                <input value={topic} onChange={e=>setTopic(e.target.value)} placeholder="Topic, e.g. How to retain what you learn" className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full mb-3" />
                <button onClick={handleGenerate} disabled={genBusy} className="bg-[#FFE600] text-black rounded-full h-10 px-5 font-semibold text-sm hover:bg-[#ffd700] disabled:opacity-60">{genBusy ? "Generating..." : "Generate slides"}</button>
                {genErr && <div className="text-red-600 text-xs mt-2">{genErr}</div>}
                <p className="text-xs opacity-50 mt-2">Uses API key from Settings. Fills slides (and title).</p>
              </div>
              <div className="border border-black/10 rounded-xl p-4">
                <h3 className="font-bold mb-2">Preview</h3>
                <div className="flex gap-2 overflow-x-auto pb-2">
                  {previewSlides.slice(0,3).map((s,i) => (
                    <div key={i} className="shrink-0 scale-[0.4] origin-top-left" style={{ width: 400, height: 500, marginRight: -240 }}>

                  ))}
                </div>
              </div>
            </div>
          </div>
        </main>
      );
    }

      function copySample() {
        const done = () => { setCopyMsg("Example JSON copied. Paste it into the slides JSON editor."); setTimeout(() => setCopyMsg(null), 4000); };
        function fallbackCopy() {
          const ta = document.createElement("textarea");
          ta.value = SAMPLE_JSON; ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch { setCopyMsg("Copy failed — select the JSON below manually."); }
          document.body.removeChild(ta);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(SAMPLE_JSON).then(done).catch(fallbackCopy);
        } else { fallbackCopy(); }
      }
      function save(e) {
        e.preventDefault();
        storage.saveSettings({ aiProvider: provider, aiApiKey: key });
        storage.setSb(sbUrl && sbKey ? { url: sbUrl.trim(), anonKey: sbKey.trim() } : null);

                </select>
              </Field>
              <Field label="API key"><input value={key} onChange={e=>setKey(e.target.value)} type="password" className="border border-black/15 rounded-lg px-3 py-2 text-sm w-full" placeholder="sk-..." /></Field>
            </fieldset>
            <button className="bg-black text-white rounded-full h-10 font-semibold text-sm hover:bg-black/80">Save</button>
            {msg && <div className="text-sm text-green-600">{msg}</div>}
          </form>

          <section className="mt-8 border border-black/10 rounded-xl p-4">
            <div className="flex items-start justify-between gap-3 flex-wrap mb-1">
              <div>
                <h2 className="text-lg font-bold">Slide JSON Field Reference</h2>
                <p className="text-xs opacity-60">{FIELD_COUNT} fields. Use any of them in a slide object — mix and match freely. Every field is optional except a headline or another content field.</p>
              </div>
              <button type="button" onClick={copySample} className="text-xs px-3 py-1.5 rounded-full bg-black text-white font-semibold hover:bg-black/80">Copy example JSON</button>
            </div>
            {copyMsg && <div className="text-xs text-green-600 mb-2">{copyMsg}</div>}

            {FIELD_GROUPS.map((g) => (
              <div key={g.group} className="mt-4">
                <h3 className="text-xs font-extrabold uppercase tracking-[0.16em] bg-[#FFE600] inline-block px-2 py-1 mb-2">{g.group}</h3>
                <div className="overflow-x-auto">
                  <table className="w-full text-xs border-collapse">
                    <thead><tr className="bg-black/5"><th className="text-left p-2 border border-black/10">Field</th><th className="text-left p-2 border border-black/10">Type</th><th className="text-left p-2 border border-black/10">Used in</th><th className="text-left p-2 border border-black/10">Description / Example</th></tr></thead>
                    <tbody>
                      {g.fields.map((f) => (
                        <tr key={f[0]}>
                          <td className="p-2 border border-black/10 font-mono whitespace-nowrap">{f[0]}</td>
                          <td className="p-2 border border-black/10 whitespace-nowrap">{f[1]}</td>
                          <td className="p-2 border border-black/10 whitespace-nowrap">{f[2]}</td>
                          <td className="p-2 border border-black/10">{f[3]}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            ))}

            <h3 className="text-sm font-bold mt-6 mb-2">Example slide objects</h3>
            <pre className="text-[10px] leading-relaxed bg-black/5 rounded-lg p-3 overflow-x-auto font-mono whitespace-pre">{SAMPLE_JSON}</pre>

            <h3 className="text-sm font-bold mt-6 mb-2">Design prompt (how it works)</h3>
            <p className="text-xs opacity-70 leading-relaxed">
              The "Design prompt" on an Account is a free-text description of the visual style & tone for that account (e.g. "Minimal educational, typography-first, black/white/yellow, short punchy headlines"). It is passed to the AI when generating or converting slides, so the AI matches your brand voice. It does NOT change the rendered design — the visual look comes from the Account's Design dropdown, accent color, and any per-slide style fields above (theme, accent, background, font, align, border, radius...). To make a different look permanent, create a new Account.
            </p>
            <h3 className="text-sm font-bold mt-4 mb-2">Tips</h3>
            <ul className="text-xs opacity-70 leading-relaxed list-disc pl-5 space-y-1">
              <li>Use <span className="font-mono">theme: "dark"</span> for a single inverted slide; the Account design still applies to the rest.</li>
              <li>Use <span className="font-mono">layout</span> to change structure without changing content: list, steps, quote, stat, split, checklist, callout, cta.</li>
              <li>Use <span className="font-mono">headlineEmphasis</span> plus <span className="font-mono">emphasisStyle</span> to reproduce the yellow highlighter look.</li>
              <li>Images accept https URLs or data URIs; use <span className="font-mono">imagePosition: "background"</span> with <span className="font-mono">imageOverlay</span> for full-bleed photos.</li>
              <li>Leave a field out entirely to use the default. Booleans default to on for border, divider and watermark.</li>
            </ul>
          </section>
        </main>
      );
    }

    function Field({ label, children }) {
      return <label className="flex flex-col gap-1"><span className="text-xs uppercase tracking-wider opacity-60">{label}</span>{children}</label>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
